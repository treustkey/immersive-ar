<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Three.js WebXR AR — 3D модель</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        #overlay {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: #fff; z-index: 10;
            background: rgba(0,0,0,0.75); text-align: center; padding: 20px;
        }
        #overlay.hidden { display: none; }
        #startBtn {
            padding: 14px 28px; font-size: 18px; border: none; border-radius: 8px;
            background: #2979ff; color: #fff; cursor: pointer; margin-top: 20px;
        }
        #startBtn:disabled { background: #555; cursor: not-allowed; }
        #info { position: fixed; top: 10px; left: 10px; color: #fff; z-index: 5;
                background: rgba(0,0,0,0.4); padding: 6px 10px; border-radius: 6px; font-size: 13px; }
        #loader { font-size: 14px; opacity: 0.8; margin-top: 10px; }
    </style>
</head>
<body>

<div id="info">Объектов размещено: <span id="count">0</span></div>

<div id="overlay">
    <h2>AR: размещение 3D-модели</h2>
    <p id="status">Проверка поддержки WebXR…</p>
    <div id="loader"></div>
    <button id="startBtn" disabled>Запустить AR</button>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader }  from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

// ---------- DOM ----------
const overlay  = document.getElementById('overlay');
const statusEl = document.getElementById('status');
const loaderEl = document.getElementById('loader');
const startBtn = document.getElementById('startBtn');
const countEl  = document.getElementById('count');

const MODEL_URL = 'буллщит.glb';

// Целевая высота модели в метрах (AR: 1 единица = 1 метр)
const TARGET_HEIGHT = 0.15; // 15 см

// ---------- Three.js сцена ----------
const scene    = new THREE.Scene();
const camera   = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 20);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Освещение
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(1, 3, 1.5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(1024, 1024);
dirLight.shadow.camera.near = 0.1;
dirLight.shadow.camera.far  = 5;
scene.add(dirLight);

// ---------- Маркер (кольцо) ----------
const reticle = new THREE.Mesh(
    new THREE.RingGeometry(0.05, 0.07, 32).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0x00ff88, side: THREE.DoubleSide })
);
reticle.matrixAutoUpdate = false;
reticle.visible = false;
scene.add(reticle);

// ---------- Загрузчик GLTF ----------
const gltfLoader = new GLTFLoader();
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
gltfLoader.setDRACOLoader(dracoLoader);

let baseModel      = null;
let modelAnimations = [];
const activeMixers = [];

function loadModel(url) {
    return new Promise((resolve, reject) => {
        loaderEl.textContent = 'Загрузка модели…';
        gltfLoader.load(
            url,
            (gltf) => {
                baseModel = gltf.scene;
                modelAnimations = gltf.animations || [];

                // Нормализация размера
                const box  = new THREE.Box3().setFromObject(baseModel);
                const size = new THREE.Vector3();
                box.getSize(size);
                const scale = TARGET_HEIGHT / size.y;
                baseModel.scale.setScalar(scale);

                // Ставим нижнюю грань на y = 0
                box.setFromObject(baseModel);
                baseModel.position.y = -box.min.y;

                // Тени + обход
                baseModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow    = true;
                        child.receiveShadow = true;
                        if (child.material) child.material.envMapIntensity = 1;
                    }
                });

                loaderEl.textContent = 'Модель загружена ✓';
                resolve();
            },
            (xhr) => {
                if (xhr.total) {
                    loaderEl.textContent = `Загрузка: ${Math.round(xhr.loaded / xhr.total * 100)}%`;
                }
            },
            reject
        );
    });
}

function createPlacedObject() {
    if (!baseModel) return null;
    const clone = baseModel.clone(true);

    if (modelAnimations.length > 0) {
        const mixer = new THREE.AnimationMixer(clone);
        mixer.clipAction(modelAnimations[0]).play();
        activeMixers.push(mixer);
    }
    return clone;
}

// ---------- WebXR ----------
let xrSession      = null;
let hitTestSource  = null;
let hitTestReady   = false;
let localRefSpace  = null;
let viewerRefSpace = null;

if (!navigator.xr) {
    statusEl.textContent = 'WebXR не поддерживается.';
} else {
    navigator.xr.isSessionSupported('immersive-ar').then(ok => {
        if (ok) {
            statusEl.textContent = 'Устройство поддерживает AR.';
            startBtn.disabled = false;
        } else {
            statusEl.textContent = 'immersive-ar недоступен. Используйте Chrome на Android или WebXR Emulator.';
        }
    });
}

startBtn.addEventListener('click', startAR);

async function startAR() {
    try {
        startBtn.disabled = true;
        await loadModel(MODEL_URL);

        xrSession = await navigator.xr.requestSession('immersive-ar', {
            requiredFeatures: ['hit-test'],
            optionalFeatures: ['local-floor', 'dom-overlay'],
            domOverlay: { root: document.body }
        });

        renderer.xr.setReferenceSpaceType('local-floor');
        await renderer.xr.setSession(xrSession);

        localRefSpace  = await xrSession.requestReferenceSpace('local-floor');
        viewerRefSpace = await xrSession.requestReferenceSpace('viewer');
        hitTestSource  = await xrSession.requestHitTestSource({ space: viewerRefSpace });
        hitTestReady   = true;

        xrSession.addEventListener('select', onSelect);
        xrSession.addEventListener('end', onSessionEnd);

        overlay.classList.add('hidden');
        renderer.setAnimationLoop(render);
    } catch (err) {
        console.error(err);
        statusEl.textContent = 'Ошибка: ' + err.message;
        startBtn.disabled = false;
    }
}

function onSelect() {
    if (!reticle.visible) return;
    const obj = createPlacedObject();
    if (!obj) return;
    obj.matrix.copy(reticle.matrix);
    obj.matrixAutoUpdate = false;
    scene.add(obj);
    countEl.textContent = String(parseInt(countEl.textContent, 10) + 1);
}

function onSessionEnd() {
    xrSession = null;
    hitTestSource = null;
    hitTestReady = false;
    reticle.visible = false;
    overlay.classList.remove('hidden');
    statusEl.textContent = 'AR-сессия завершена.';
    startBtn.disabled = false;
    renderer.setAnimationLoop(null);
}

const clock = new THREE.Clock();
function render(timestamp, frame) {
    if (!frame) return;

    if (hitTestReady && hitTestSource) {
        const results = frame.getHitTestResults(hitTestSource);
        if (results.length > 0) {
            const pose = results[0].getPose(localRefSpace);
            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
        } else {
            reticle.visible = false;
        }
    }

    const dt = clock.getDelta();
    for (const m of activeMixers) m.update(dt);

    renderer.render(scene, camera);
}

addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
